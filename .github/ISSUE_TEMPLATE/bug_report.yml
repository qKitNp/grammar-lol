name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security issues, use [private reporting](https://github.com/qKitNp/grammar-lol/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. Open …
        2. Select text …
        3. Double-tap Right Shift …
        4. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Multiple / unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Release tag or git commit if known.
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - ChatGPT
        - SuperGrok
        - Not signed in / n/a
        - Both / unknown
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact tokens). Screenshots welcome.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I redacted any secrets or personal data from this report
          required: true
